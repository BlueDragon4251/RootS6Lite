name: Experimental baseline kernel build (NOT FLASHABLE)
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'GitHub owner/repo of kernel sources (research only)'
        type: string
        required: true
        default: 'gta4xlve-dev/android_kernel_samsung_gta4xlve'
      source_commit:
        description: 'Full 40-char source commit SHA (immutable)'
        type: string
        required: true
        default: 'ef3c0a5dd63453bcc85e67b6a9feae17c3c8808b'
      required_kernel_version:
        description: 'Expected stock major/minor/sublevel (4.14.190)'
        type: string
        required: true
        default: '4.14.190'
      research_only:
        description: 'Allow mismatching community source for compilation research only'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: experimental-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline-build:
    name: Compile baseline only - NEVER FLASH
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Validate immutable source identifier
        env:
          SOURCE_REPO: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 2
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || exit 2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            make bc bison flex build-essential libssl-dev libelf-dev \
            libncurses-dev python3 rsync cpio pahole

      - name: Download immutable kernel source commit
        env:
          SOURCE_REPO: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p kernel
          git -C kernel init
          git -C kernel remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C kernel fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Check source compatibility BEFORE compilation
        env:
          SOURCE_LABEL: ${{ inputs.source_repository }}@${{ inputs.source_commit }}
          REQUIRED_KERNEL_VERSION: ${{ inputs.required_kernel_version }}
          RESEARCH_ONLY: ${{ inputs.research_only }}
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          if [[ "$RESEARCH_ONLY" == "true" ]]; then
            python3 scripts/audit_kernel.py \
              --makefile kernel/Makefile --reference "$SOURCE_LABEL" \
              --expected "$REQUIRED_KERNEL_VERSION" \
              --output build-evidence/source-audit.json \
              --markdown build-evidence/source-audit.md
          else
            python3 scripts/audit_kernel.py \
              --makefile kernel/Makefile --reference "$SOURCE_LABEL" \
              --expected "$REQUIRED_KERNEL_VERSION" --require-match \
              --output build-evidence/source-audit.json \
              --markdown build-evidence/source-audit.md
          fi
          cat build-evidence/source-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build unmodified baseline (no KernelSU, no Odin package)
        run: |
          bash scripts/build_baseline.sh kernel "$PWD/build-output" "$PWD/build-evidence"

      - name: Upload research evidence and raw kernel (NOT FLASHABLE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXPERIMENTAL-NOT-FLASHABLE-${{ github.run_number }}
          path: |
            build-evidence/
            build-output/arch/arm64/boot/Image
            build-output/arch/arm64/boot/Image.gz
            build-output/.config
          if-no-files-found: warn
          retention-days: 14
